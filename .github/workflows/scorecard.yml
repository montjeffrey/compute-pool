name: Scorecard

# OpenSSF Scorecard rates this repository's supply-chain practices and
# publishes the result (the README badge). Findings go to the Security tab.
# With one maintainer, its Code-Review check stays low; that is expected.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
